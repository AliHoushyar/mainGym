<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style/fest.css" />
    <link rel="stylesheet" href="./style/Wallet.css" />
    <link rel="stylesheet" href="./style/points.css" />
    <link rel="stylesheet" href="./style/address.css" />
    <link rel="stylesheet" href="./style/prof.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    />
    <link rel="stylesheet" href="./style/phoneSideBar.css" />
  </head>
  <body>
    <div class="siteTop">
      <img class="BGI" src="./img/topBG.jpg" alt="gym" />
      <img class="BGI gg" src="./img/topBG2.jpg" alt="gym" />
      <div class="menu">
        <button class="menuBtn">
          <i class="bx bx-menu-alt-right"></i>
        </button>
        <span class="menuTitle">پروفایل</span>
        <button class="helpBtn">
          <a
            style="color: rgb(255, 255, 255); text-decoration: none"
            href="./index.html"
            ><i class="bx bxs-home"></i
          ></a>
        </button>
      </div>
    </div>
    <div class="phoneSideBar">
      <div class="sideBarContainer">
        <div class="logoPanel">
          <img class="logoSide" src="./img/logoside.png" alt="" />
          <button class="closeBTN"><img src="./img/close.png" alt="" /></button>
        </div>
        <div class="sideSeprator"></div>
        <div class="sideButtons">
          <button>
            <a href="./index.html"><i class="bx bx-home"></i>خانه</a>
          </button>
          <button>
            <a href="./profile.html"><i class="bx bx-user"></i>پروفایل</a>
          </button>
          <button>
            <a href="./profile.html"><i class="bx bx-star"></i>امتیاز ها</a>
          </button>
          <button>
            <a href="./wallet.html"><i class="bx bx-wallet"></i>کیف پول</a>
          </button>
          <button>
            <a href="./address.html"><i class="bx bx-map"></i>آدرس ها</a>
          </button>
          <button>
            <a href="./phones.html"
              ><i class="bx bx-phone bx-flip-horizontal"></i>تلفن ها</a
            >
          </button>
          <button>
            <a href="./fest.html"><i class="bx bx-gift"></i>جشنواره ها</a>
          </button>
          <button>
            <a href="./invite.html"
              ><i class="bx bx-envelope"></i>دعوت از دوستان</a
            >
          </button>
        </div>
        <img class="sideFooter" src="./img/sideFooter.png" alt="" />
      </div>
    </div>
    <div class="better"></div>
    <img class="topIMG2" src="./img/user.png" alt="" />
    <div class="sideBar">
      <div class="Sidewallet">
        <span class="Sidecash">78,500,000</span>
        <span class="Sideunit">ریال</span>
      </div>
      <div class="SidetopBtn">
        <button class="addMoney"><i class="bx bx-plus"></i></button>
        <button class="points"><i class="bx bx-star"></i></button>
        <button class="receipt"><i class="bx bx-receipt"></i></button>
      </div>
    </div>
    <div class="container">
      <div class="nameLastName">
        <img class="nameImage" src="./img/username.png" alt="" />
        <div class="nameTitle">
          <p>نام و نام خانوادگی</p>
          <p>سطح کاربر</p>
        </div>
      </div>
      <div class="walletPanel">
        <div class="panelTexts">
          <p>موجودی:</p>
          <div class="txt">
            <p>120,000,000</p>
            <p class="currency">تومان</p>
          </div>
        </div>
        <button class="panelButton">
          <a class="btnLink" href="">
            کیف پول<i class="bx bx-left-arrow-alt"></i>
          </a>
        </button>
      </div>
      <div class="pointPanel">
        <div class="panelTexts">
          <p>امتیاز:</p>
          <div class="txt">
            <p>12025</p>
            <p class="currency">امتیاز</p>
          </div>
        </div>
        <button class="panelButton">
          <a class="btnLink" href="">
            امتیاز ها<i class="bx bx-left-arrow-alt"></i>
          </a>
        </button>
      </div>
    </div>
    <div class="desktopContainer">
      <div class="desknameLastName">
        <img class="nameImage" src="./img/username.png" alt="" />
        <div class="nameTitle">
          <p>نام و نام خانوادگی</p>
          <p>سطح کاربر</p>
        </div>
      </div>
      <div class="deskcards">
        <div class="deskWalletCard">
          <div class="deskCardTexts">
            <p>موجودی</p>
            <p>120,000,000</p>
          </div>
        </div>
        <div class="deskPointCard">
          <div class="deskCardTexts">
            <p>امتیاز ها</p>
            <p>12025</p>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="./js/jquery.js"></script>
  <script src="./js/main.js"></script>
</html>
